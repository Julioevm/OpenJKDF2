name: Windows SDL3

on:
  workflow_dispatch:
  push:
    branches: 
      - master
  pull_request:
    branches:
      - master

jobs:
  build:

    runs-on: ubuntu-24.04

    env:
      OPENJKDF2_BUILD_DIR: /tmp/OpenJKDF2
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
        name: Checkout
      - name: Install Packages
        run: |
          sudo apt-get update -qq &&
          sudo apt-get install \
                       -y --no-install-suggests --no-install-recommends \
                       build-essential devscripts cmake make python3 python3-pip imagemagick &&
          sudo apt-get install -y zsh mingw-w64 clang libopenal-dev libglew-dev &&
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix &&
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix &&
          sudo pip3 install cogapp
      - name: Generate CMake Build System
        run: |
          # GITHUB_RUNNER_COMPILE disables audio, PhysFS and networking.
          # Leave it undefined for a playable build, including on reused caches.
          cmake --toolchain cmake_modules/toolchain_mingw.cmake \
                -DCMAKE_BUILD_TYPE=Debug -UGITHUB_RUNNER_COMPILE \
                -DOPENJKDF2_RELEASE_COMMIT="$GITHUB_SHA" \
                -DOPENJKDF2_RELEASE_COMMIT_SHORT="${GITHUB_SHA:0:8}" \
                -B "$OPENJKDF2_BUILD_DIR"
      - name: Make
        run: make -C "$OPENJKDF2_BUILD_DIR" -j $(nproc)
      - name: Package Windows x64 runtime
        run: python3 scripts/package_win64_ci.py "$OPENJKDF2_BUILD_DIR" "$RUNNER_TEMP/OpenJKDF2-windows-x64"
      - name: Upload Windows x64 build
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenJKDF2-windows-x64-${{ github.sha }}
          path: ${{ runner.temp }}/OpenJKDF2-windows-x64/
          if-no-files-found: error
          retention-days: 30
      - name: Link download
        run: echo 'Download [Windows x64 build](${{ steps.artifact.outputs.artifact-url }}) (requires your own game data).' >> "$GITHUB_STEP_SUMMARY"

  validate-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OpenJKDF2-windows-x64-${{ github.sha }}
          path: runtime
      - name: Verify runtime DLLs load on Windows x64
        shell: python
        run: |
          import ctypes
          import os
          from pathlib import Path
          runtime = Path('runtime').resolve()
          assert (runtime / 'openjkdf2-64.exe').is_file()
          with os.add_dll_directory(str(runtime)):
              loaded = [ctypes.WinDLL(str(path)) for path in runtime.glob('*.dll')]
          print(f'Loaded {len(loaded)} packaged DLLs on Windows x64.')
